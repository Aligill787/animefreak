    <!-- OpenGraph -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">

          "@type": "Organization",
          "@id": "https://animefreak.culture/#organization",

            "https://instagram.com/animefreak_mag",
            "https://youtube.com/@animefreak_culture"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://animefreak.culture/#website",
          "url": "https://animefreak.culture",
          "name": "AnimeFreak",
          "publisher": {
            "@id": "https://animefreak.culture/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://animefreak.culture/?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
